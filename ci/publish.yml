# ============================================================================
# publish.yml — DeepSeek Harness Sidebar 发布流水线 / Release pipeline
# ----------------------------------------------------------------------------
# 用 GitHub Actions 代替本地 vsce 打包发布（本机网络受限，无需本地装 vsce）。
# This workflow replaces local vsce publishing (works even where the local
# machine has no network access to the Marketplaces).
#
# 需要的 Secrets —— 在 GitHub 仓库 Settings → Secrets and variables → Actions
# 里新增（仓库级）：
# Required secrets — add under repo Settings → Secrets and variables → Actions:
#
#   VSCE_PAT        必填 / required
#                   VS Code Marketplace 发布者 token。这是一个 Azure DevOps
#                   Personal Access Token（https://dev.azure.com → User
#                   settings → Personal Access Tokens），需勾选 Marketplace →
#                   Manage 权限。token 绑定的 publisher 必须与 package.json 中
#                   "publisher" 字段完全一致，否则发布会被 Marketplace 拒绝。
#                   A VS Code Marketplace publisher token: an Azure DevOps PAT
#                   (https://dev.azure.com → User settings → Personal Access
#                   Tokens) with the Marketplace → Manage scope. The publisher
#                   bound to the PAT must match the "publisher" field in
#                   package.json or the Marketplace rejects the publish.
#
#   OPEN_VSX_TOKEN  可选 / optional
#                   open-vsx.org 的发布 token（在 open-vsx.org 的个人设置里
#                   生成）。不配置时，ovsx 步骤会被跳过（见下方 if 条件）——
#                   Open VSX 不是必需目标。
#                   Publish token for open-vsx.org (generate it under your
#                   open-vsx.org user settings). When unset the ovsx step is
#                   skipped (see the if condition below) — Open VSX is an
#                   optional target.
#
# 版本策略 / Versioning:
#   打 tag 前，先把 package.json 的 "version" 改成目标版本（例如 0.1.0）并提交，
#   再推送 tag（例如 v0.1.0）。流水线读取 package.json 中的 version 作为发布
#   版本；--skip-duplicate 保证重复发布同一版本只是 no-op，不会让流水线失败。
#   Before tagging, bump the "version" field in package.json to the target
#   version (e.g. 0.1.0) and commit, then push the tag (e.g. v0.1.0). The
#   pipeline publishes the version found in package.json; --skip-duplicate
#   makes re-publishing an already-published version a harmless no-op.
# ============================================================================
name: Publish Extension

on:
  push:
    tags:
      - 'v*'              # 打 v* tag 时发布 / publish on any v* tag
  workflow_dispatch:      # 也支持手动触发 / manual trigger is supported too

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce and ovsx
        run: |
          npm install -g @vscode/vsce
          npm install -g ovsx

      # 发布到 VS Code Marketplace（必做）/ publish to the VS Code Marketplace
      - name: Publish to VS Code Marketplace
        run: vsce publish --pat ${{ secrets.VSCE_PAT }} --skip-duplicate

      # 发布到 Open VSX（可选）/ publish to Open VSX (optional)
      # 未配置 OPEN_VSX_TOKEN 时整步跳过；即使失败也不影响整体结论。
      # Skipped entirely when OPEN_VSX_TOKEN is not configured; failures here
      # never fail the workflow thanks to continue-on-error.
      - name: Publish to Open VSX (optional)
        if: ${{ secrets.OPEN_VSX_TOKEN != '' }}
        continue-on-error: true
        run: ovsx publish --pat ${{ secrets.OPEN_VSX_TOKEN }} --skip-duplicate
